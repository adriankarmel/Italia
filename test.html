<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>F1 Countdown Dashboard</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Tarjeta del reloj -->
  <div class="f1-countdown-container">
    <div class="f1-countdown-title">NEXT RACE COUNTDOWN</div>
    
    <div class="f1-countdown-timer">
      <div class="f1-time-block">
        <span class="f1-number" id="days">00</span>
        <span class="f1-label">DAYS</span>
      </div>
      
      <div class="f1-divider">:</div>
  
      <div class="f1-time-block">
        <span class="f1-number" id="hours">00</span>
        <span class="f1-label">HRS</span>
      </div>
  
      <div class="f1-divider">:</div>
  
      <div class="f1-time-block">
        <span class="f1-number" id="minutes">00</span>
        <span class="f1-label">MIN</span>
      </div>
  
      <div class="f1-divider">:</div>
  
      <div class="f1-time-block">
        <span class="f1-number" id="seconds">00</span>
        <span class="f1-label">SEC</span>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
<style>
    @import url('https://googleapis.com');

:root {
  --f1-body-bg: radial-gradient(circle at top, #0f0f12 0%, #040405 100%);
  --f1-bg-card: rgba(18, 18, 21, 0.9);  /* Color gris/negro humo NextUI */
  --f1-border: rgba(255, 255, 255, 0.08); 
  --f1-text-main: #ffffff;              
  --f1-text-muted: #71717a;             
  --f1-accent: #e10600;                 /* Rojo F1 */
}

/* Forzar que toda la pantalla sea del color oscuro */
html, body {
  margin: 0;
  padding: 0;
  width: 100%;
  height: 100%;
  background: var(--f1-body-bg) !important;
  background-color: #040405 !important;
  display: flex;
  justify-content: center;
  align-items: center;
}

/* Tarjeta contenedora estilo F1 Dashboard */
.f1-countdown-container {
  font-family: 'Inter', sans-serif;
  background: var(--f1-bg-card);
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
  border: 1px solid var(--f1-border);
  border-radius: 14px;
  padding: 24px 32px;
  min-width: 380px;
  box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6);
}

.f1-countdown-title {
  font-size: 0.7rem;
  font-weight: 900;
  letter-spacing: 0.12em;
  color: var(--f1-text-muted);
  margin-bottom: 18px;
  text-transform: uppercase;
  display: flex;
  align-items: center;
}

.f1-countdown-title::before {
  content: '';
  display: inline-block;
  width: 4px;
  height: 12px;
  background-color: var(--f1-accent);
  margin-right: 8px;
  border-radius: 2px;
}

.f1-countdown-timer {
  display: flex;
  align-items: center;
  justify-content: space-between;
}

.f1-time-block {
  display: flex;
  flex-direction: column;
  align-items: center;
  min-width: 65px;
}

/* IMPORTANTE: inline-block es mandatorio para animar transiciones de transformación */
.f1-number {
  font-family: 'JetBrains Mono', monospace;
  font-size: 2.5rem;
  font-weight: 700;
  color: var(--f1-text-main);
  line-height: 1;
  display: inline-block; 
  will-change: transform;
}

.f1-label {
  font-size: 0.6rem;
  font-weight: 700;
  color: var(--f1-text-muted);
  letter-spacing: 0.08em;
  margin-top: 8px;
}

.f1-divider {
  font-family: 'JetBrains Mono', monospace;
  font-size: 1.8rem;
  color: rgba(113, 113, 122, 0.4);
  padding-bottom: 14px;
  user-select: none;
}

/* Efecto de rebote hacia arriba dinámico cada segundo */
@keyframes f1Pop {
  0% {
    transform: translateY(4px);
    opacity: 0.7;
    color: var(--f1-accent); /* Destello rojo en el cambio */
  }
  50% {
    transform: translateY(-2px);
    opacity: 0.9;
  }
  100% {
    transform: translateY(0);
    opacity: 1;
    color: var(--f1-text-main);
  }
}
</style>
<script>
    let timerInterval;

async function fetchNextRace() {
  const titleElement = document.querySelector(".f1-countdown-title");
  try {
    const currentYear = new Date().getFullYear();
    const response = await fetch(`https://jolpi.ca{currentYear}.json`);
    if (!response.ok) throw new Error();
    
    const data = await response.json();
    const races = data.MRData.RaceTable.Races;
    const now = new Date();
    let nextRace = null;

    for (let race of races) {
      const raceDateTime = new Date(`${race.date}T${race.time || "00:00:00Z"}`);
      if (raceDateTime > now) {
        nextRace = race;
        break;
      }
    }

    if (nextRace) {
      titleElement.innerText = `NEXT RACE: ${nextRace.raceName.toUpperCase()}`;
      startCountdown(new Date(`${nextRace.date}T${nextRace.time || "00:00:00Z"}`).getTime());
    }
  } catch (e) {
    titleElement.innerText = "NEXT RACE COUNTDOWN";
    // Si falla la API usa una fecha de respaldo
    startCountdown(new Date().getTime() + 500000000); 
  }
}

function startCountdown(targetDate) {
  if (timerInterval) clearInterval(timerInterval);

  function updateCountdown() {
    const now = new Date().getTime();
    const difference = targetDate - now;

    if (difference <= 0) {
      document.querySelector(".f1-countdown-timer").innerHTML = "<div style='color:#e10600; font-weight:900;'>RACE WEEKEND!</div>";
      clearInterval(timerInterval);
      return;
    }

    const days = Math.floor(difference / (1000 * 60 * 60 * 24));
    const hours = Math.floor((difference % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
    const minutes = Math.floor((difference % (1000 * 60 * 60)) / (1000 * 60));
    const seconds = Math.floor((difference % (1000 * 60)) / 1000);

    setAnimatedValue("days", String(days).padStart(2, "0"));
    setAnimatedValue("hours", String(hours).padStart(2, "0"));
    setAnimatedValue("minutes", String(minutes).padStart(2, "0"));
    setAnimatedValue("seconds", String(seconds).padStart(2, "0"));
  }

  updateCountdown();
  timerInterval = setInterval(updateCountdown, 1000);
}

function setAnimatedValue(id, newValue) {
  const element = document.getElementById(id);
  if (element && element.innerText !== newValue) {
    element.innerText = newValue;
    // Forzamos el reinicio de la animación eliminando y volviendo a añadir la clase
    element.style.animation = 'none';
    element.offsetHeight; // Truco de reflujo del navegador
    element.style.animation = 'f1Pop 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275)';
  }
}

fetchNextRace();

</script>
